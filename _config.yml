# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Head title and info.
title: "Junteng Liu"
name: "Junteng Liu"
description: >-
  Personal homepage of Junteng Liu — first-year Ph.D. candidate at the HKUST NLP Group, working on natural language processing and machine learning.

googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

minimal_mistakes_skin: default
search: true
markdown: kramdown
permalink: /:categories/:title/

# Reading Files
output_dir: public
# exclude:
#   - ".sass-cache/"
#   - ".jekyll-cache/"

timezone: Asia/Hong_Kong
repository: tramnhat492414-coder/LJT-Homepage

defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
remote_theme: academicpages/academic-pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

include:
  - _pages

keep_files:
  - images

search_provider: lunr
lunr_search:
  min_length: 1
  fields: {title, excerpt, tags, content, tags, category}
  expand_upper_case: true
  index_files: true

# Social sharing
og_image: /assets/images/profile.jpg

# Analytics
analytics:
  provider: false

# Footer
footer:
  links:
    - label: "Twitter/X"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/junteng88716710"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jliugi@connect.ust.hk"
