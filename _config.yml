# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Junteng Liu
email: jliugi@connect.ust.hk
description: >- # this means to ignore newlines until "baseurl"
  Personal homepage of Junteng Liu — first-year Ph.D. candidate at the HKUST NLP Group, working on natural language processing and machine learning.
twitter_username: junteng88716710
github_username: Vicent0205
minimal_mistakes_skin: default
search: true
# text_align: right

# Build settings
markdown: kramdown
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Asia/Hong_Kong # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

repository: tramnhat492414-coder/LJT-Homepage

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

include:
  - _pages

exclude:
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

keep_files:
  - images
  - /assets/js/

# jekyll-seo-tag overrides
logo: /assets/img/academic_avatar.webp
twitter:
  username: junteng88716710
social:
  type: Person
  name: Junteng Liu
  links:
    - https://twitter.com/junteng88716710
    - https://github.com/Vicent0205

# Analytics
analytics:
  provider: "google-universal"
  google:
    tracking_id: "G-12345"
